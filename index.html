const ST={heart:[".rr.rr.","rrrrrrr","rrrrrrr",".rrrrr.","..rrr..","...r..."],star:["...y...","...y...","yyyyyyy",".yyyyy.","..yyy..",".yy.yy.",".y...y."],crown:["y..y..y","yy.y.yy","yyyyyyy","yrybyry","yyyyyyy"],balloon:[".bbbb.","bWbbbb","bWbbbb","bbbbbb",".bbbb.","..bb..","...k..."],cat:["o.....o","ooooooo","ookoook","ooopooo",".ooooo."],cake:["..y.y..","..k.k..","WWWWWWW","ppppppp","bbbbbbb","WWWWWWW"],moon:['..yyy','.yy..','yy...','.yy..','..yyy'],fish:['..bbbb..b','.bbbbbbbb','bbkbbbbbb','.bbbbbbbb','..bbbb..b'],ghost:['.ppppp.','ppppppp','pkpppkp','ppppppp','ppppppp','ppppppp','p.p.p.p']};
function spr(m,s){const c=document.createElement('canvas');c.width=m[0].length;c.height=m.length;c.style.cssText=`width:${c.width*s}px;height:${c.height*s}px;image-rendering:pixelated;display:block`;const g=c.getContext('2d');m.forEach((r,y)=>[...r].forEach((ch,x)=>ch==='k'?RR(g,'#1f3a5f',x,y,1,1):PAL[ch]&&RR(g,PAL[ch],x,y,1,1)));return c}
function stk(g,n,cx,cy2){const m=ST[n],s=6,w=m[0].length;m.forEach((r,y)=>[...r].forEach((c,x)=>PAL[c]&&RR(g,PAL[c],Math.round(cx-w*s/2+x*s),Math.round(cy2-m.length*s/2+y*s),s,s)))}
function edit(src){
 mb.innerHTML=`<h2>edit stiker</h2><div class="sw" id="sp" style="gap:6px"></div><canvas id="ec" style="max-width:100%;max-height:52vh;width:auto;height:auto;display:block;margin:0 auto;border:3px solid var(--ink);touch-action:manipulation"></canvas><p style="font-size:20px;margin-top:6px">pilih stiker, lalu tap di foto.</p><div class="row"><button class="btn alt" id="eu">undo</button><a class="btn" id="ed" style="text-decoration:none" download="photobooth-stiker.png">download</a></div>`;
 const c=$('#ec'),g=c.getContext('2d'),im=new Image(),P=[];let cur='heart';const paint=()=>{g.drawImage(im,0,0);P.forEach(p=>stk(g,p.n,p.x,p.y))};
 im.onload=()=>{c.width=im.width;c.height=im.height;paint()};im.src=src;
 Object.keys(ST).forEach(n=>{const lk=['moon','fish','ghost'].includes(n)&&!ls('bday-unlock'),b=document.createElement('button');b.style.cssText='border:3px solid var(--ink);background:#fff;padding:2px;cursor:pointer';if(lk){b.textContent='?';b.style.cssText+=';opacity:.5;font:14px "Press Start 2P";width:40px;height:40px';b.title='main game, skor 40+'}else{b.appendChild(spr(ST[n],4));b.onclick=()=>cur=n}$('#sp').appendChild(b)});
 c.onpointerdown=e=>{const r=c.getBoundingClientRect();P.push({n:cur,x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height});paint()};
 $('#eu').onclick=()=>{P.pop();paint()};$('#ed').onclick=()=>{$('#ed').href=c.toDataURL('image/png')};
}

fl.geometry=new THREE.PlaneGeometry(16,14);fl.position.set(1,0,1);bw.geometry=new THREE.PlaneGeometry(16,5.5);bw.position.x=1;lw.geometry=new THREE.PlaneGeometry(14,5.5);lw.position.z=1;
S.children.forEach(o=>{
 if(o.isLight||o===LG||o===noteG)return;
 const g=o.geometry&&o.geometry.type,P=(o.geometry&&o.geometry.parameters)||{};
 if(g==='BoxGeometry'&&P.width===10&&P.height===.9){o.geometry=new THREE.BoxGeometry(16,.9,.1);o.position.x=1}
 else if(g==='BoxGeometry'&&P.depth===8){o.geometry=new THREE.BoxGeometry(.1,.9,14);o.position.z=1}
 else if(g==='BoxGeometry'&&P.width===10&&P.height===.2){o.geometry=new THREE.BoxGeometry(16,.2,.2);o.position.set(1,0,8);return}
 if(o.position.z<=-3.85){o.position.z-=2;if(g==='SphereGeometry'||g==='ConeGeometry')o.position.x*=1.4;else if(g==='BoxGeometry'&&P.width===3&&P.height===3.4)o.position.x+=2.5;else if(o.position.x<-2.3)o.position.x-=1.5}
 if(o.position.x<=-4.65)o.position.x-=2;
});
bw.position.y=lw.position.y=2.75;
tvG.position.set(0,0,-5.2);pot.position.set(2.8,0,-5.3);lp.position.set(-3.4,0,-2.4);lampL.position.set(-3.4,3.6,-2.4);
st.position.set(5.6,0,-1.4);sh.position.set(-6.7,0,-3);ar.position.set(-6.2,0,.5);bo.position.set(-6.2,0,3.4);ar.rotation.y=bo.rotation.y=Math.PI/2;

/* ===== cangkir kopi/teh, piringan hitam (muter saat radio on), sfx 8-bit ===== */
const SFX=(()=>{let ac,on=ls('bday-sfx')!=='0';const tone=(f,d,t,v,w)=>{if(!on)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();const T=ac.currentTime+(w||0),o=ac.createOscillator(),g=ac.createGain();o.type=t||'square';o.frequency.setValueAtTime(f,T);g.gain.setValueAtTime(v||.05,T);g.gain.exponentialRampToValueAtTime(.0001,T+d);o.connect(g);g.connect(ac.destination);o.start(T);o.stop(T+d+.02)}catch(e){}};
 return{click:()=>tone(300,.05),pop:()=>{tone(500,.06,'sine',.08);tone(800,.05,'sine',.06,.05)},fan:()=>[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.18,'square',.05,i*.12)),get on(){return on},set(v){on=v;ls('bday-sfx',v?'1':'0')}}})();
